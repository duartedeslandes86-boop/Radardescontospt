name: Canal - aviso "em breve" com vídeo (manual)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "escreve exatamente: publicar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  avisar:
    if: ${{ inputs.confirmar == 'publicar' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enviar vídeo "em breve" para o canal
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID || '-1003846917730' }}
        run: |
          VIDEO="https://raw.githubusercontent.com/duartedeslandes86-boop/radardescontospt/main/social-media/aviso/em-breve-9x16.mp4"
          CAPTION="$(printf '%s\n' 'Estamos a preparar a partida 🚀' 'Submarinos prontos a mergulhar. Fica atento.' '' '📸 Instagram: instagram.com/radar_descontospt' '🎵 TikTok: tiktok.com/@radardescontos_pt' '📘 Facebook: facebook.com/profile.php?id=1425522530641237')"
          curl -sS -f "https://api.telegram.org/bot${TOKEN}/sendVideo" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "video=${VIDEO}" \
            --data-urlencode "caption=${CAPTION}"
