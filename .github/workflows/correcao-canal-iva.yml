name: Canal - correção sobre preços Amazon (manual)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "escreve exatamente: publicar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  corrigir:
    if: ${{ inputs.confirmar == 'publicar' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enviar correção para o canal
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID || '-1003846917730' }}
        run: |
          TEXTO="$(printf '%s\n' '⚠️ Correção às listas "Top … Amazon ES" de hoje' '' 'Escrevemos "preços com IVA PT incluído", e não o podemos garantir.' 'Os preços são os da Amazon ES, para entrega em Portugal. O valor final aparece sempre no checkout.' '' 'Pedimos desculpa pela confusão. — Radar Descontos')"
          RESP="$(curl -sS -f "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXTO}")"
          echo "$RESP"
