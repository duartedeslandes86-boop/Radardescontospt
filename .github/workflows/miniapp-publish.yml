name: Mini App - publicar catálogo (manual)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = só valida; publicar = envia para o Worker radar-miniapp"
        type: choice
        options: [teste, publicar]
        default: teste

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar JSON do catálogo
        run: node -e "const p=require('./miniapp-live/products.json'); if(!Array.isArray(p)||p.length===0) throw new Error('catálogo vazio'); console.log('produtos:', p.length)"
      - name: Teste (sem publicar)
        if: ${{ inputs.modo == 'teste' }}
        run: npx --yes wrangler@4 deploy --config wrangler.miniapp.toml --dry-run --outdir dist-miniapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publicar no Worker radar-miniapp
        if: ${{ inputs.modo == 'publicar' }}
        run: npx --yes wrangler@4 deploy --config wrangler.miniapp.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
