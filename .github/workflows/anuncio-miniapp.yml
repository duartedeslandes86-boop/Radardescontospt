name: Mini App - anúncio no canal (manual)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "escreve exatamente: publicar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  anunciar:
    if: ${{ inputs.confirmar == 'publicar' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enviar anúncio para o canal
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID || '-1003846917730' }}
        run: |
          TEXTO="$(printf '%s\n' '🧭 Novidade na Mini App do Radar!' '' 'Reorganizámos tudo por setores, para ser mais fácil de explorar:' '📱 Eletrónica & Tech · 🏡 Casa & Jardim · 🏃 Desporto & Ar Livre' '💄 Beleza & Saúde · 👕 Moda & Acessórios · 🚗 Automóvel' '' 'Com produtos de todas as lojas parceiras + Amazon.es, e um separador "Destaques" com os melhores descontos verificados do momento.' '' '👉 https://t.me/radardescontospt_bot/radar')"
          curl -sS -f "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXTO}"
