name: Radar Descontos & Tech PT - Auto Engine (24/7)

on:
  schedule:
    - cron: '*/20 7-21 * * *'
  workflow_dispatch:
    inputs:
      force_top_day:
        description: 'Publicar já o Top 5 do dia'
        type: boolean
        default: false
      publish_welcome:
        description: 'Publicar e fixar a mensagem de boas-vindas'
        type: boolean
        default: false

permissions:
  contents: write

# Nunca correr dois ciclos ao mesmo tempo (evita posts repetidos e conflitos no push)
concurrency:
  group: radar-auto
  cancel-in-progress: false

jobs:
  radar:
    name: Varrimento e Publicação Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Histórico de preços fica na cache do Actions (não enche o repositório)
      - name: Recuperar histórico de preços
        uses: actions/cache/restore@v5
        with:
          path: price_history.json
          key: price-history-${{ github.run_id }}
          restore-keys: price-history-

      # Biblioteca para montar a imagem em grelha (se falhar, o bot envia em álbum)
      - name: Instalar biblioteca de imagens
        continue-on-error: true
        run: npm install --prefix "$RUNNER_TEMP/deps" sharp@0.34 --no-audit --no-fund

      - name: Executar Ciclo do Radar Autónomo
        env:
          NODE_PATH: ${{ runner.temp }}/deps/node_modules
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_ADMIN_CHAT_ID }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          FORCE_TOP_DAY: ${{ inputs.force_top_day && 'true' || 'false' }}
          PUBLISH_WELCOME: ${{ inputs.publish_welcome && 'true' || 'false' }}
        run: node cron-runner.mjs

      - name: Guardar histórico de preços
        if: always()
        uses: actions/cache/save@v5
        with:
          path: price_history.json
          key: price-history-${{ github.run_id }}

      - name: Guardar histórico anti-duplicação no repositório
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@radardescontos.pt"
          git add sent_deals.json daily_deals.json || true
          if git diff --staged --quiet; then
            echo "Sem alterações ao estado."
            exit 0
          fi
          git commit -m "chore: update sent deals"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Falhou o push do estado" && exit 1
