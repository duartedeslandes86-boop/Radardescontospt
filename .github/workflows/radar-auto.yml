name: Radar Descontos & Tech PT - Auto Engine (24/7)

on:
  schedule:
    # Executa a cada 20 minutos (24 horas por dia, 7 dias por semana)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    # Permite execução manual a qualquer momento via painel do GitHub Actions

permissions:
  contents: write

jobs:
  radar-autopilot:
    name: Varrimento e Publicação Telegram
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Ciclo do Radar (Zero-Dependency)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8933540772:AAFP2_IKfYKLADfcv5rn7Miq_MuFnPEy1p4' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1003846917730' }}
        run: node cron-runner.mjs

      - name: Guardar histórico anti-duplicação no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@radardescontos.pt"
          git add sent_deals.json || true
          git diff --staged --quiet || (git commit -m "chore: update sent deals" && git push)
