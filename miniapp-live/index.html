<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Descontos</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f5f5f7; --card:#ffffff; --text:#111; --muted:#6b6b72; --accent:#2481cc; --ok:#1f8a4c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181c; --card:#22242a; --text:#f2f2f4; --muted:#9a9aa3; --accent:#5ab0f0; --ok:#4cc17f; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .tabs { display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; }
  .tab { border:1px solid var(--muted); background:none; color:var(--text); border-radius:999px; padding:6px 12px; font-size:13px; white-space:nowrap; cursor:pointer; }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:var(--card); border-radius:14px; padding:10px; display:flex; flex-direction:column; }
  .card img { width:100%; aspect-ratio:1/1; object-fit:contain; border-radius:10px; background:#fff; }
  .name { font-size:14px; margin:8px 0 4px; line-height:1.3; }
  .price { font-size:15px; font-weight:600; color:var(--ok); min-height:20px; }
  .btn { margin-top:8px; display:block; text-align:center; background:var(--accent); color:#fff; text-decoration:none; border-radius:10px; padding:9px; font-size:14px; font-weight:600; }
  .empty { text-align:center; color:var(--muted); padding:40px 16px; font-size:15px; }
  .foot { margin-top:20px; font-size:12px; color:var(--muted); line-height:1.5; }
  .code-box { display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--bg); border:1px dashed var(--accent); border-radius:10px; padding:8px 10px; margin-top:8px; }
  .code-val { font-family:ui-monospace,Menlo,monospace; font-size:15px; font-weight:700; letter-spacing:1px; }
  .copy { border:none; background:var(--accent); color:#fff; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4; }
  .store { font-size:12px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; }
  @media (min-width: 480px) { .grid { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<h1>Radar Descontos &amp; Tech PT</h1>
<p class="sub">Descontos selecionados em tech, casa e desporto.</p>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="foot">
  Os preços só aparecem quando foram confirmados no link ou no checkout. Quando um preço não está confirmado, não é mostrado. Os links são de afiliado: podemos receber uma comissão, sem custo extra para ti.
</div>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const euro = n => n.toFixed(2).replace('.', ',') + ' €';

  function open(url) {
    if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank');
  }

  function setActive(btn) {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('on'));
    btn.classList.add('on');
  }

  function copyCode(code, btn) {
    try {
      navigator.clipboard.writeText(code).then(
        () => { btn.textContent = 'Copiado'; setTimeout(() => btn.textContent = 'Copiar', 1500); },
        () => { btn.textContent = 'Erro'; }
      );
    } catch (e) { btn.textContent = 'Erro'; }
  }

  function renderCodes(codes) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = '1fr';
    if (!codes.length) {
      grid.innerHTML = '<div class="empty">Sem códigos de momento.</div>';
      return;
    }
    for (const c of codes) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="store"></div>
        <div class="name"></div>
        <div class="code-box" style="display:none"><span class="code-val"></span><button class="copy">Copiar</button></div>
        <div class="meta"></div>
        <div class="meta"></div>
        <a class="btn" href="#">Ver oferta</a>`;
      card.querySelector('.store').textContent = c.loja;
      card.querySelector('.name').textContent = c.titulo;
      if (c.codigo) {
        const box = card.querySelector('.code-box');
        box.style.display = 'flex';
        box.querySelector('.code-val').textContent = c.codigo;
        const copyBtn = box.querySelector('.copy');
        copyBtn.addEventListener('click', () => copyCode(c.codigo, copyBtn));
      }
      const metas = card.querySelectorAll('.meta');
      metas[0].textContent = 'Validade: ' + c.validade + (c.nota ? '. ' + c.nota : '');
      metas[1].textContent = 'Confirmado: ' + c.confirmado;
      const a = card.querySelector('.btn');
      a.href = c.link;
      a.addEventListener('click', e => { e.preventDefault(); open(c.link); });
      grid.appendChild(card);
    }
  }

  function renderLoading() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '<div class="empty">A carregar…</div>';
  }

  function render(products) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = '';
    if (!products.length) {
      grid.innerHTML = '<div class="empty">Sem ofertas de momento. Vê o canal para as últimas.</div>';
      return;
    }
    for (const p of products) {
      const card = document.createElement('div');
      card.className = 'card';
      const priceTxt = p.precoVerificado && typeof p.preco === 'number' ? euro(p.preco) : '';
      card.innerHTML = `
        <img src="${p.imagem}" alt="" loading="lazy">
        <div class="store"></div>
        <div class="name"></div>
        <div class="price"></div>
        <a class="btn" href="#">Ver oferta</a>`;
      card.querySelector('.store').textContent = p.loja || '';
      card.querySelector('.name').textContent = p.nome;
      card.querySelector('.price').textContent = priceTxt;
      const a = card.querySelector('.btn');
      a.href = p.link;
      a.addEventListener('click', e => { e.preventDefault(); open(p.link); });
      grid.appendChild(card);
    }
  }

  // cache de ficheiros já descarregados, para não voltar a pedir ao trocar de separador
  const fileCache = {};
  async function loadFile(file) {
    if (fileCache[file]) return fileCache[file];
    try {
      const r = await fetch(file, { cache: 'no-store' });
      const data = await r.json();
      fileCache[file] = data;
      return data;
    } catch (e) { return []; }
  }

  async function init() {
    let manifest = { sectores: [] };
    let codes = [];
    try {
      const r = await fetch('manifest.json', { cache: 'no-store' });
      manifest = await r.json();
    } catch (e) { manifest = { sectores: [] }; }
    try {
      const r = await fetch('codigos.json', { cache: 'no-store' });
      codes = await r.json();
    } catch (e) { codes = []; }

    const tabs = document.getElementById('tabs');

    // Separador "Destaques": melhores descontos verificados, carregado logo de início
    const destaquesBtn = document.createElement('button');
    destaquesBtn.className = 'tab on';
    destaquesBtn.textContent = 'Destaques';
    destaquesBtn.onclick = async () => {
      setActive(destaquesBtn);
      renderLoading();
      render(await loadFile('destaques.json'));
    };
    tabs.appendChild(destaquesBtn);

    // Um separador por setor (Awin, todas as lojas, + Amazon.es), carregado só quando é aberto
    manifest.sectores.forEach(s => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.textContent = `${s.label} (${s.count})`;
      b.onclick = async () => {
        setActive(b);
        renderLoading();
        render(await loadFile(s.file));
      };
      tabs.appendChild(b);
    });

    // Separador próprio para códigos: fora dos setores
    const codeTab = document.createElement('button');
    codeTab.className = 'tab';
    codeTab.textContent = 'Códigos';
    codeTab.onclick = () => { setActive(codeTab); renderCodes(codes); };
    tabs.appendChild(codeTab);

    renderLoading();
    render(await loadFile('destaques.json'));
  }
  init();
</script>
</body>
</html>
