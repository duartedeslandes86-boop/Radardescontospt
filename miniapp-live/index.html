<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Descontos</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f5f5f7; --card:#ffffff; --text:#111; --muted:#6b6b72; --accent:#2481cc; --ok:#1f8a4c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181c; --card:#22242a; --text:#f2f2f4; --muted:#9a9aa3; --accent:#5ab0f0; --ok:#4cc17f; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .tabs { display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; }
  .tab { border:1px solid var(--muted); background:none; color:var(--text); border-radius:999px; padding:6px 12px; font-size:13px; white-space:nowrap; cursor:pointer; }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:var(--card); border-radius:14px; padding:10px; display:flex; flex-direction:column; }
  .card img { width:100%; aspect-ratio:1/1; object-fit:contain; border-radius:10px; background:#fff; }
  .name { font-size:14px; margin:8px 0 4px; line-height:1.3; }
  .price { font-size:15px; font-weight:600; color:var(--ok); min-height:20px; }
  .btn { margin-top:8px; display:block; text-align:center; background:var(--accent); color:#fff; text-decoration:none; border-radius:10px; padding:9px; font-size:14px; font-weight:600; }
  .empty { text-align:center; color:var(--muted); padding:40px 16px; font-size:15px; }
  .foot { margin-top:20px; font-size:12px; color:var(--muted); line-height:1.5; }
  @media (min-width: 480px) { .grid { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<h1>Radar Descontos &amp; Tech PT</h1>
<p class="sub">Descontos selecionados em tech, casa e desporto.</p>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="foot">
  Os preços só aparecem quando foram confirmados no link ou no checkout. Quando um preço não está confirmado, não é mostrado. Os links são de afiliado: podemos receber uma comissão, sem custo extra para ti.
</div>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const euro = n => n.toFixed(2).replace('.', ',') + ' €';

  function open(url) {
    if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank');
  }

  function render(products, cat) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const list = products.filter(p => cat === 'Todos' || p.categoria === cat);
    if (!list.length) {
      grid.innerHTML = '<div class="empty">Sem ofertas de momento. Vê o canal para as últimas.</div>';
      return;
    }
    for (const p of list) {
      const card = document.createElement('div');
      card.className = 'card';
      const priceTxt = p.precoVerificado && typeof p.preco === 'number' ? euro(p.preco) : '';
      card.innerHTML = `
        <img src="${p.imagem}" alt="" loading="lazy">
        <div class="name"></div>
        <div class="price"></div>
        <a class="btn" href="#">Ver oferta</a>`;
      card.querySelector('.name').textContent = p.nome;
      card.querySelector('.price').textContent = priceTxt;
      const a = card.querySelector('.btn');
      a.href = p.link;
      a.addEventListener('click', e => { e.preventDefault(); open(p.link); });
      grid.appendChild(card);
    }
  }

  async function init() {
    let products = [];
    try {
      const r = await fetch('products.json', { cache: 'no-store' });
      products = await r.json();
    } catch (e) { products = []; }
    const cats = ['Todos', ...new Set(products.map(p => p.categoria).filter(Boolean))];
    const tabs = document.getElementById('tabs');
    cats.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (i === 0 ? ' on' : '');
      b.textContent = c;
      b.onclick = () => {
        tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
        b.classList.add('on');
        render(products, c);
      };
      tabs.appendChild(b);
    });
    render(products, 'Todos');
  }
  init();
</script>
</body>
</html>
